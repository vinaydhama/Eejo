<style>
  .slideshow {
    width: 300px;
    height: 200px;
    position: relative;
    overflow: hidden;
  }

  .slideshow img {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    animation: fade 9s infinite;
  }

  .slideshow img:nth-child(1) {
    animation-delay: 0s;
  }

  .slideshow img:nth-child(2) {
    animation-delay: 3s;
  }

  .slideshow img:nth-child(3) {
    animation-delay: 6s;
  }

  @keyframes fade {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    30%  { opacity: 1; }
    40%  { opacity: 0; }
    100% { opacity: 0; }
  }
</style>
