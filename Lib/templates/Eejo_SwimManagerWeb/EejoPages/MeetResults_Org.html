    function ClearTable(TableName) {
      var tableHeaderRowCount = 0;
      if (TableName == 'tblMeet') {
        tableHeaderRowCount = 0;
      }

      var table = document.getElementById(TableName);
      if (table) {
        var rowCount = table.rows.length;
        for (var i = tableHeaderRowCount; i < rowCount; i++) {
          table.deleteRow(tableHeaderRowCount);
        }
      }
    }

    document.getElementById('LocalFileSelector').addEventListener('change', function (event) {

            MeetUpdatedData = jsonData;
            SerachSwimRecords(MeetUpdatedData)

            //                LoadHeatNames("Local")
          } catch (error) {
            console.error("Error parsing JSON:", error);

        };

        reader.onerror = function (e) {
          console.error("Error reading file:", e);
          alert("Error reading the file.");
        };

        reader.readAsText(file); // Read the file content as text
      }
    });

        }
      });

    function Resort(data) {

      //       const data = [
      //     { key: 10, value: 8 },
      //     { key: 12, value: 7 },
      //     { key: 2, value: 5 },
      //     { key: 8, value: 5 },
      //     { key: 11, value: 4 },
      //     { key: 4, value: 1 },
      //     { key: 6, value: 1 },
      //     { key: 7, value: 1 },
      //     { key: 1, value: 0 },
      //     { key: 3, value: 0 },
      //     { key: 5, value: 0 },
      //     { key: 9, value: 0 },
      //     { key: 13, value: 0 }
      // ];

      const sortedData = data.sort((a, b) => {
        if (a.value === 0 && b.value === 0) return 0; // both zero
        if (a.value === 0) return 1; // a goes to bottom
        if (b.value == 0) return -1; // b goes to bottom
        return a.value - b.value; // normal ascending sort
      });
      return sortedData;

    }

    function GetPoints(Rank) {
      let score = 0;
      switch (Rank) {
        case 0:
          score = 0;
          break;
        case 1:
          score = 7;
          break;

        case 2:
          score = 5;
          break;

        case 3:
          score = 4;
          break;
        case 4:
          score = 3;
          break;
        case 5:
          score = 2;
          break;
        case 6:
          score = 1;
          break;
        case 7:
          score = 0;
          break;

        default:
          score = 0;
          break;
      }
      return score
    }

    function PltEventTable(eventID, eventName, EventResultArray, eventNameID) {
      // Create a new table
      let tbl1 = document.createElement("table");
      tbl1.id = "tblMeetResult_" + eventID;
      AvblReports.push({ value: tbl1.id, text: "Event" + eventID + " " + eventName })
      // AvblReports.push(tbl1.id);
      tbl1.border = "1";
      tbl1.style.marginBottom = "20px";
      tbl1.style.width = "100%";
      let container = document.getElementById("resultsContainer");

      // Append to container
      container.appendChild(tbl1);

      // Header row
      let HeaderRow = tbl1.insertRow();
      let td = HeaderRow.insertCell();
      td.innerHTML = `<h3><b>Event ${eventID} : ${eventName}</b></h3>`;
      td.colSpan = 7;
      td.style.backgroundColor = "rgb(160, 160, 160)";

      // Column titles
      let newRow = tbl1.insertRow();
      newRow.style.backgroundColor = "rgb(200, 200, 200)";
      const headers = ["Sl.NO", "Rank", "Swimmer Name", "Swimmer Club / School", "Swim Status", "Swim Timings", "Points"];
      headers.forEach(header => {
        newRow.insertCell().innerHTML = `<b>${header}</b>`;
      });

      // Prepare data for ranking
      let x = EventResultArray.map(result => {
        if (result.SwimStatus === 0) {
          return result.SwimTimings !== 12.34 ? result.SwimTimings : 0;
        }
        return 0;
      });

      let RankSorted = SortAndGetRank(x);
      let BoardRanks = RankSorted.map((value, index) => ({ key: index + 1, value }));

      let sortedBoards = BoardRanks.sort((a, b) => {
        if (a.value === 0 && b.value !== 0) return 1;
        if (a.value !== 0 && b.value === 0) return -1;
        return a.value - b.value;
      });

      // Populate table
      for (let eventIndex = 0; eventIndex < EventResultArray.length; eventIndex++) {
        newRow = tbl1.insertRow();
        let swimmer = EventResultArray[sortedBoards[eventIndex].key - 1];

        if (!(swimmer.SwName in swClubGroupDict)) {
          swClubGroupDict[swimmer.SwName] = { SwClub: "ClubUnknown", SwGroup: "Group_Unknown", TotalScore: 0 };
        }

        let previousScore = swClubGroupDict[swimmer.SwName].TotalScore;
        let currentScore = GetPoints(sortedBoards[eventIndex].value);
        swClubGroupDict[swimmer.SwName].TotalScore = previousScore + currentScore;
        swClubGroupDict[swimmer.SwName].EventDetails = swClubGroupDict[swimmer.SwName].EventDetails + formatSwimmingEvent(eventNameID,MeetUpdatedData.EventList) + " : " + "  " + DQMsg[swimmer.SwimStatus] + " " + ConvertTime(swimmer.SwimTimings) + ";"

        newRow.insertCell().innerHTML = eventIndex + 1;
        newRow.insertCell().innerHTML = sortedBoards[eventIndex].value;
        newRow.insertCell().innerHTML = swimmer.SwName;
        newRow.insertCell().innerHTML = swimmer.SwimerClub;
        newRow.insertCell().innerHTML = DQMsg[swimmer.SwimStatus];
        newRow.insertCell().innerHTML = `<b>${ConvertTime(swimmer.SwimTimings !== 12.34 ? swimmer.SwimTimings : 0)}</b>`;
        newRow.insertCell().innerHTML = `<b>${currentScore}</b>`;
      }
    }
