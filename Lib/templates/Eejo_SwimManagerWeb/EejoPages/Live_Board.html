  <script>
    // let DQMsg = ["", "AB", "DQ", "DNC", "ES"];
    let seconds = 0;
    let timervaldate=0;
    let timervalTime=0;


    // Timer
    setInterval(() => {
        const nw= new Date();
        timervaldate = nw.toDateString();
        timervalTime = nw.toLocaleTimeString();
        // timerval= " " +  + " " + ;
        // document.getElementById('timer').innerHTML =  `<p> ${nw.toDateString()}  <br> ${nw.toLocaleTimeString()}</p>`;
    }, 1000);

    function formatSwimTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(Math.floor(seconds % 60)).padStart(2, '0');
      const millis = String((seconds % 1).toFixed(3)).slice(2);
      return `${mins}:${secs}.${millis}`;
    }

    async function updateLeaderboard() {
      try {
        const table = document.getElementById('leaderboard-table');
        // table.innerHTML="";

        const params = new URLSearchParams(window.location.search);
        let dataUrl = params.get('dataUrl');
        //http://10.115.239.190:5002/SetLiveHeatCommands?CmdName=LiveBoard
        if (dataUrl) {
          document.body.innerHTML = "<h3 style='color:red;text-align:center;'>Missing dataUrl parameter!</h3>";
        }          
          else{
          cmdurlwithHost = "http://" + GetEejoHostID() + ":5002" + "/SetLiveHeatCommands?CmdName=LiveBoard";
          dataUrl=cmdurlwithHost;
          }
        
        

        const response = await fetch(dataUrl);
        const jsonData = await response.json();

        // Extract new structure
        const boardData = jsonData.commandReturnData.BoardStatusAndTime;
        const clubs = jsonData.commandReturnData.Club;
        const names = jsonData.commandReturnData.SwNames;

        // Combine data
        const swimmers = boardData.map((item, index) => ({
          BoardID: item.BoardID,
          SwimTimings: item.Time,
          SwimerName: names[index] || "Unknown",
          ClubName: clubs[index] || "Unknown",
          SwimStatus: item.Status,
          LockStatus: item.LockStatus
        }));

      
// Separate valid and zero-time swimmers
const validSwimmers = swimmers.filter(s => s.SwimTimings > 0 && s.LockStatus !== 0)
                               .sort((a, b) => a.SwimTimings - b.SwimTimings);
const zeroTimeOrLockedSwimmers = swimmers.filter(s => s.SwimTimings === 0 || s.LockStatus === 0);

// Assign ranks only to valid swimmers
let currentRank = 1;
let previousTime = null;
validSwimmers.forEach((swimmer, index) => {
  if (previousTime !== null && swimmer.SwimTimings !== previousTime) {
    currentRank = index + 1;
  }
  swimmer.Rank = currentRank;
  previousTime = swimmer.SwimTimings;
});

// Rank = 0 for zero-time or locked swimmers
zeroTimeOrLockedSwimmers.forEach(swimmer => swimmer.Rank = 0);

// Combine and sort by BoardID
const rankedSwimmers = [...validSwimmers, ...zeroTimeOrLockedSwimmers].sort((a, b) => a.BoardID - b.BoardID);
// const eventname = document.getElementById('event-name');
// eventname.innerHTML=" " + jsonData.commandReturnData.EventID +"  " + formatSwimmingEvent(jsonData.commandReturnData.HeatName,[]).fullname;

        // Update table
       
const Meetname="Millennium World School Hassan Dec 2025";

const eventID = jsonData.commandReturnData.EventID;
const heatFullName = formatSwimmingEvent(jsonData.commandReturnData.HeatName, []).fullname;

// table.innerHTML ="";
table.innerHTML = `
  <thead>
    <tr>
      <th colspan="6" style="
        padding: 6px 8px;
        text-align: center;
      ">
        <h1 style="margin: 0; font-size: 1.5rem;">${Meetname}</h1>
      </th>
    </tr>

    <tr>
      <th colspan="4" style="
        padding: 6px 8px;
        text-align: left;
        font-weight: 600;
      ">
        Event ${eventID} : ${heatFullName} </th>
        <th colspan="2">
        <span style="
          padding-left: 5%;
          display: inline-block;
          text-align: end;
          font-size: 0.8rem;
          font-weight: 200;
        ">        
          ${timervaldate} <br> ${timervalTime}
        </span>
      </th>
    </tr>

    <tr>
      <th style="padding: 4px 6px; text-align: left;">Lane</th>
      <th style="padding: 4px 6px; text-align: left;">Rank</th>
      <th style="padding: 4px 6px; text-align: left;">Team</th>
      <th style="padding: 4px 6px; text-align: left;">Name</th>
      <th style="padding: 4px 6px; text-align: left;">Time</th>
      <th style="padding: 4px 6px; text-align: left;">Status</th>
    </tr>
  </thead>
`;



        rankedSwimmers.forEach(swimmer => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><span style="
          padding-left: 5%;
          display: inline-block;
          text-align: center;
          font-size: 0.8rem;
          font-weight: 200;
        "> L:${String(swimmer.BoardID).padStart(2, '0')}</span></td>
            <td>${swimmer.Rank}</td>
            <td ><span style="
          padding-left: 5%;
          display: inline-block;
          text-align: left;
          font-size: 0.8rem;
          font-weight: 200;
        ">   ${swimmer.ClubName} </span></td>
            <td> <span style="
          padding-left: 5%;
          display: inline-block;
          text-align: left;
          font-size: 1rem;
          font-weight: 200;
        "> ${swimmer.SwimerName}</span></td>
            <td><b> ${swimmer.SwimTimings === 0 ? '00:00.000' : formatSwimTime(swimmer.SwimTimings)}<b></td>
            <td><span style="
          padding-left: 5%;
          display: inline-block;
          text-align: center;
          font-size: 1rem;
          font-weight: 200;
        "> ${DQMsg[swimmer.SwimStatus] || ""} </span</td>
          `;
          table.appendChild(row);
        });

      } catch (error) {
        console.error('Error fetching leaderboard data:', error);
      }
    }
    updateLeaderboard();
    setInterval(updateLeaderboard, 500);
  </script>
