  <script>
    MeetDataFirebaseURL = "https://eejo-managerdb-default-rtdb.firebaseio.com/Meets.json";
    let SelectedMeetName = [];
    let SelectedEventName = [];
    let MeetNameArray = [];
    let EventNameArray = [];
    let swClubGroupDict = {};
    let AvblClubNames = {};
    let AvblGroup = {};
    let SelectedSource={};

    cmdurlwithHost = "http://" + GetEejoHostID() + ":5002";    
    //cmdurlwithHost = "http://192.168.7.241:5002";
    //cmdurlwithHost = "http://LocalHost:5002";

    showhide("BusyIndicatorpop");

    

    function ClearTable(TableName) {
      var tableHeaderRowCount = 0;
      if (TableName == 'tblMeet') {
        tableHeaderRowCount = 0;
      }

      var table = document.getElementById(TableName);
      var rowCount = table.rows.length;
      for (var i = tableHeaderRowCount; i < rowCount; i++) {
        table.deleteRow(tableHeaderRowCount);
      }

    }
    async function LoadHeatNames(HeatFileSource) { 
      ClearTable('tblMeetResult');
      switch (HeatFileSource) {

        case "GetRunningHeatData":        
          cmdurl = cmdurlwithHost + "/SetLiveHeatCommands?CmdName=GetRunningHeatData";
          try {
            let response = await fetch(cmdurl);
            let data = await response.json();
            MeetDataFirebase = data.commandReturnData;
            if (data.commandReturnData != "") {
              SerachSwimRecords(MeetDataFirebase)
            }
          } catch (error) {
            console.error('Error fetching data:', error);
          }
          break;
        case "Online":
          MeetDataFirebase = FetchEventNames();
          break;

        case "Offline":
          cmdurl = cmdurlwithHost + "/getAvailableHeatNames";
          try {
            let response = await fetch(cmdurl);
            let data = await response.json();
            // console.log(data);
            MeetNameArray = LoadHeatFileName(data);
            NoofBoards = MeetNameArray.Boards;
            initMeetNames(HeatFileSource);

          } catch (error) {
            console.error('Error fetching data:', error);
          }

          break;

        default:
          break;
      }
    }

    function UpdateSwClubAndGroup(SwimmerDetails) {
      SwKeys = Object.keys(SwimmerDetails);
      
      SwKeys.forEach(swname => {
        swClubGroupDict[swname] = { SwClub: SwimmerDetails[swname].Club, SwGroup: SwimmerDetails[swname].Group, TotalScore: 0 }

        if ((SwimmerDetails[swname].Club in AvblClubNames) == false) {
          AvblClubNames[SwimmerDetails[swname].Club] = 0;
        }
        if ((swname.Group in AvblGroup) == false) {
          AvblGroup[SwimmerDetails[swname].Group] = 0;
        }
      });
    }

    function SerachSwimRecords(MeetData) {
      UpdateSwClubAndGroup(MeetData.SwimmerDetails);
      let table = document.getElementById("tblMeetResult");
      let HeaderRow = table.insertRow();
      meet = MeetData;
      meet.EventDetails.forEach(evendetail => {
        EventResultArray = [];
        evendetail.HeatList.forEach(Boards => {
          Boards.BoardList.forEach(Board => {
            ''
            let SwClubAndGrp = {};
            SwClubAndGrp.SwClub = "SwClub";
            SwClubAndGrp.SwGroup = "SwGroup";
            if (Board.SwimerName in swClubGroupDict) {
              SwClubAndGrp = swClubGroupDict[Board.SwimerName];
            }
            let SwimTimings=0;

            if (Board.SwimTimings!= 12.34)
            {
              SwimTimings=Board.SwimTimings;
            }
           

            EventResultArray.push({
              'SwName': Board.SwimerName, 'SwimerClub': SwClubAndGrp.SwClub, 'Group': SwClubAndGrp.SwGroup,
              'SwimStatus': Board.SwimStatus, 'SwimTimings': Board.SwimTimings
            })
          });
        });
        PltEventTable(evendetail.eventID, "eventName", EventResultArray);
      });
      PltIndChampTable();
    }

    async function FetchEventNames() {
      showhide("BusyIndicatorpop", "Loading Swimmer table");
      // busyi.show();

      var dataAPI = fetch(MeetDataFirebaseURL)
        .then(response => {
          return response.json()
        })
        .then(data => {
          MeetNameArray = LoadMeetNames(data)
          initMeetNames("Online");
          MeetDataFirebase = data;
          showhide("BusyIndicatorpop");
          return;
        }, error => {
          console.error('onRejected function called: ' + error.message);
        })
    }
function refreshMeet()
{  
      switch (SelectedSource.Type) {
        case "GetRunningHeatData":
        LoadHeatNames(SelectedSource.Type)
          break;
      
        default:
          initMeetNames (SelectedSource.Type);
          break;
      }
      
    
}
    function initMeetNames(HeatFileSource) {
      new MultiSelect('#dynamic1', {
        data: MeetNameArray,
        placeholder: 'Select Meet',
        search: true,
        selectAll: false,
        listAll: true,
        onChange: function (value, text, element) {
        },
        onSelect: async function (value, text, element) {
          if (HeatFileSource == "Online") {
            SerachSwimRecords(MeetDataFirebase[text])
          }
          else if (HeatFileSource == "Offline") {
            try {
              cmdurl = cmdurlwithHost + "/SetLiveHeatCommands?CmdName=ReadHeatFromLocalFile&HeatFileName=" + value;
              let response = await fetch(cmdurl);
              let data = await response.json();
              // console.log(data);
              MeetDataFirebase = data.commandReturnData;
              SerachSwimRecords(MeetDataFirebase);
            } catch (error) {
              console.error('Error fetching data:', error);
            }
          }

          //console.log('Selected:', value, text, element);
        },
        onUnselect: function (value, text, element) {
          SelectedMeetName.pop(text);
          EventNameArray = LoadEventNames(MeetDataFirebase, SelectedMeetName);
          initEventNames();
          //console.log('Unselected:', value, text, element);
        }
      });
    }


    function initEventNames() {
      new MultiSelect('#dynamic1', {
        data: EventNameArray,
        placeholder: 'Select Events',
        search: true,
        selectAll: true,
        listAll: true,
        onChange: function (value, text, element) {
          //console.log('Change:', value, text, element);
        },
        onSelect: function (value, text, element) {
          SelectedEventName.push(text);       
        },
        onUnselect: function (value, text, element) {
          SelectedEventName.pop(text);          
        }
      });
    }

    async function FetchEventData() {
      showhide("BusyIndicatorpop", "Loading Swimmer table");
      // busyi.show();

      var dataAPI = fetch(MeetDataFirebaseURL)
        .then(response => {
          return response.json()
        })
        .then(data => {
          MeetNameArray = LoadSwNames(data)
          // initSwNames();
          MeetDataFirebase = data;
          showhide("BusyIndicatorpop");
          return;
        }, error => {
          console.error('onRejected function called: ' + error.message);
        })
    }



    function PltIndChampTable() {

      var x = [];
      SwKeys = Object.keys(swClubGroupDict);
      let AvblGroup = {}
      let AvblClub = {}
      let RankSortted;

      Object.keys(swClubGroupDict).forEach(key => {
        element = swClubGroupDict[key]
        if ((element.SwGroup in AvblGroup)) {
          AvblGroup[element.SwGroup] = AvblGroup[element.SwGroup] + ":" + key;
        }
        else {
          AvblGroup[element.SwGroup] = key
        }
        if ((element.SwClub in AvblClub)) {
          AvblClub[element.SwClub] = AvblClub[element.SwClub] + ":" + key;
        }
        else {
          AvblClub[element.SwClub] = key
        }
      });

      Object.keys(AvblGroup).forEach(Grpkey => {
        element = AvblGroup[Grpkey]
        var Swimmeringroup = element.split(":");
        let ScoreArray=[];        
        Swimmeringroup.forEach(Swname => {
          ScoreArray.push(swClubGroupDict[Swname].TotalScore)
        });

        RankSortted = SortAndGetRankDescending(ScoreArray);

        let sortedBoards


        for (var i = 0; i <= RankSortted.length; i++) {

          const BoarsRank = RankSortted.map((RankSortted, index) => ({
            key: index + 1,
            value: RankSortted
          }));

          sortedBoards = BoarsRank.sort((a, b) => {
            if (a.value === 0 && b.value !== 0) return 1;
            if (a.value !== 0 && b.value === 0) return -1;
            return a.value - b.value;

          });

        }
        SwKeys = Object.values(sortedBoards);        
        //Sorting Results
        let DictKeys = Object.keys(swClubGroupDict)
        let tbl1 = document.getElementById("tblMeetResult");
      
          // Group IC
        let HeaderRow = tbl1.insertRow();
        td = HeaderRow.insertCell();
        td.innerHTML = " <h3> IC Group: " + Grpkey + "</h3>";
        td.setAttribute('colSpan', '4');
        newRow = tbl1.insertRow();
        newRow.insertCell().innerHTML = " <b>Sl.NO</b>";
        newRow.insertCell().innerHTML = " <b>Rank</b>";

        newRow.insertCell().innerHTML = " <b>SwimerName</b>";
        newRow.insertCell().innerHTML = " <b>Swimer Club / School</b>";
        newRow.insertCell().innerHTML = " <b>Total Points</b>";
        let eventIndex = 0;

        Object.keys(sortedBoards).forEach(Swnamekey => {
          newRow = tbl1.insertRow();
          DictElement = sortedBoards[Swnamekey]
          eventIndex++;
          newRow.insertCell().innerHTML = (eventIndex);
          newRow.insertCell().innerHTML = DictElement.value;
          newRow.insertCell().innerHTML = Swimmeringroup[DictElement.key-1];
          newRow.insertCell().innerHTML = swClubGroupDict[Swimmeringroup[DictElement.key-1]].SwClub;
          newRow.insertCell().innerHTML = swClubGroupDict[Swimmeringroup[DictElement.key-1]].TotalScore;
        });
      });



      Object.keys(AvblClub).forEach(Clbkey => {
        element = AvblClub[Clbkey]
        var Swimmeringroup = element.split(":");
        let ScoreArray=[];        
        Swimmeringroup.forEach(Swname => {
          ScoreArray.push(swClubGroupDict[Swname].TotalScore)
        });

        RankSortted = SortAndGetRankDescending(ScoreArray);

        let sortedBoards


        for (var i = 0; i <= RankSortted.length; i++) {

          const BoarsRank = RankSortted.map((RankSortted, index) => ({
            key: index + 1,
            value: RankSortted
          }));

          sortedBoards = BoarsRank.sort((a, b) => {
            if (a.value === 0 && b.value !== 0) return 1;
            if (a.value !== 0 && b.value === 0) return -1;
            return a.value - b.value;
          });
        }

        SwKeys = Object.values(sortedBoards);        
        //Sorting Results
        let DictKeys = Object.keys(swClubGroupDict)
        let tbl1 = document.getElementById("tblMeetResult");
        let clbscore=0
      
          // Group IC
          let HeaderRow = tbl1.insertRow();
        td = HeaderRow.insertCell();
        // td.innerHTML=   " <h3> IC Club: "+ Clbkey +"</h3>";
        // td.setAttribute('colSpan', '4');
        newRow = tbl1.insertRow();
        newRow.insertCell().innerHTML = " <b>Sl.NO</b>";
        newRow.insertCell().innerHTML = " <b>Rank</b>";
        newRow.insertCell().innerHTML = " <b>SwimerName</b>";
        newRow.insertCell().innerHTML = " <b> Group </b>";                
        newRow.insertCell().innerHTML = " <b>Total Points</b>";

        let eventIndex = 0;

        Object.keys(sortedBoards).forEach(Swnamekey => {
          newRow = tbl1.insertRow();
          DictElement = sortedBoards[Swnamekey]
          eventIndex++;
          newRow.insertCell().innerHTML = (eventIndex);
          newRow.insertCell().innerHTML = DictElement.value;
          newRow.insertCell().innerHTML = Swimmeringroup[DictElement.key-1];
          newRow.insertCell().innerHTML = swClubGroupDict[Swimmeringroup[DictElement.key-1]].SwGroup;
          newRow.insertCell().innerHTML = swClubGroupDict[Swimmeringroup[DictElement.key-1]].TotalScore;
          clbscore= clbscore+ swClubGroupDict[Swimmeringroup[DictElement.key-1]].TotalScore;
        });
        td.innerHTML=   " <h3> IC Club: "+ Clbkey +"<b> Total: "+ clbscore +"</b></h3>";
        td.setAttribute('colSpan', '4');
      });

    
    }

    function GetPoints(Rank) {
      let score = 0;
      switch (Rank) {
        case 0:
          score = 0;
          break;
        case 1:
          score = 7;
          break;

        case 2:
          score = 5;
          break;

        case 3:
          score = 3;
          break;

        default:
          score = 1;
          break;
      }
      return score
    }

    function PltEventTable(eventID, eventName, EventResultArray) {

      // Get the table and insert a new row at the end
      let tbl1 = document.getElementById("tblMeetResult");
      let HeaderRow = tbl1.insertRow();
      td = HeaderRow.insertCell();
      td.innerHTML = " <h3> Event: " + eventID + "</h3>";
      td.setAttribute('colSpan', '5');

      newRow = tbl1.insertRow();
      newRow.insertCell().innerHTML = " <b>Sl.NO</b>";
      newRow.insertCell().innerHTML = " <b>Rank</b>";
      newRow.insertCell().innerHTML = " <b>SwimerName</b>";
      newRow.insertCell().innerHTML = " <b>Swimer Club / School</b>";
      newRow.insertCell().innerHTML = " <b>SwimStatus</b>";
      newRow.insertCell().innerHTML = " <b>SwimTimings</b>";
      newRow.insertCell().innerHTML = " <b>Points</b>";

      var x = [];
      for (var i = 0; i < EventResultArray.length; i++) {
        if (EventResultArray[i].SwimStatus == 0) {
          if (EventResultArray[i].SwimTimings!=12.34)
          {
            x.push(EventResultArray[i].SwimTimings);
          }
          else
          {
            x.push(0);
          }

        }
        else {
          x.push(0);
        }
      }

      let RankSortted = SortAndGetRank(x);
      let sortedBoards


      for (var i = 0; i <= RankSortted.length; i++) {

        const BoarsRank = RankSortted.map((RankSortted, index) => ({
          key: index + 1,
          value: RankSortted
        }));

        sortedBoards = BoarsRank.sort((a, b) => {
          if (a.value === 0 && b.value !== 0) return 1;
          if (a.value !== 0 && b.value === 0) return -1;
          return a.value - b.value;
        });
      }
   

      for (let eventIndex = 0; eventIndex < EventResultArray.length; eventIndex++) {
        newRow = tbl1.insertRow();        
        if (!(EventResultArray[eventIndex].SwName in swClubGroupDict)) {
          swClubGroupDict[EventResultArray[eventIndex].SwName] = { "SwClub": "Club-1", "SwGroup": "G3", "TotalScore": 0 };
        }
        let keyval = sortedBoards[eventIndex].key - 1;
        let PreviousScore = 0;
        if (EventResultArray[keyval].SwName in swClubGroupDict) {
          PreviousScore = swClubGroupDict[EventResultArray[keyval].SwName].TotalScore;
        }
        newRow.insertCell().innerHTML = eventIndex + 1;
        newRow.insertCell().innerHTML = sortedBoards[eventIndex].value;
        newRow.insertCell().innerHTML = EventResultArray[keyval].SwName;
        newRow.insertCell().innerHTML = EventResultArray[keyval].SwimerClub;
        newRow.insertCell().innerHTML = DQMsg[EventResultArray[keyval].SwimStatus];
        let swtime=0
        if (EventResultArray[keyval].SwimTimings!=12.34 )
        {
          swtime = EventResultArray[keyval].SwimTimings;
        }
        newRow.insertCell().innerHTML = "<b>" + ConvertTime(swtime) + "</b>";
        let currentScore = GetPoints(sortedBoards[eventIndex].value);
        newRow.insertCell().innerHTML = "<b>" + currentScore + "</b>";
        swClubGroupDict[EventResultArray[keyval].SwName].TotalScore = PreviousScore + currentScore;
      }

    }

  </script>
