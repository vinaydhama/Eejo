            break;

            break;

            cmdurl = cmdurlwithHost + "/getAvailableHeatNames";

              // Meetdteails = ExtractMeetInfo(MeetNameArray, "");

              // Meetdteails = ExtractMeetInfo(MeetNameArray, "");

      function UpdateSwClubAndGroup(SwimmerDetails) {
        SwKeys = Object.keys(SwimmerDetails).filter(key => key !== "length");

        SwKeys.forEach(swname => {
          swClubGroupDict[swname.trim()] = { SwClub: SwimmerDetails[swname].Club, SwGroup: SwimmerDetails[swname].Group + "_" + SwimmerDetails[swname].Gender, TotalScore: 0, EventDetails: "" }

          if ((SwimmerDetails[swname].Club in AvblClubNames) == false) {
            AvblClubNames[SwimmerDetails[swname].Club] = 0;
          }
          if ((swname.Group in AvblGroup) == false) {
            AvblGroup[SwimmerDetails[swname].Group] = 0;
          }
        });
      }


      // --- small helpers ---
      const isDict = (obj) => !!obj && typeof obj === 'object' && !Array.isArray(obj);
      const toValues = (maybeDictOrArray) => isDict(maybeDictOrArray) ? Object.values(maybeDictOrArray) : (Array.isArray(maybeDictOrArray) ? maybeDictOrArray : []);


      function SerachSwimRecords(MeetData = MeetUpdatedData) {
        EventResultsDict = {};
        let EventCounter = 0;

        // --- EventDetails: now a dict keyed by eventID ---
        toValues(MeetData.EventDetails).forEach(eventDetail => {
          if (!eventDetail) return;
          EventCounter++;

          const EventResultArray = [];

          // --- HeatList: now a dict keyed by HeatID ---
          toValues(eventDetail.HeatList).forEach(heatObj => {
            if (!heatObj) return;

            // BoardList may be dict or array; normalize to values
            toValues(heatObj.BoardList).forEach(Board => {
              if (!Board) return;

              // Default club/group
              let SwClubAndGrp = { SwClub: "SwClub", SwGroup: "SwGroup" };
              if (Board.SwimerName && swClubGroupDict && (Board.SwimerName in swClubGroupDict)) {
                SwClubAndGrp = swClubGroupDict[Board.SwimerName];
              }

              // Filter/normalize swim timings if needed
              // (Your original code excluded 12.34; keeping that logic if you still use it)
              let SwimTimings = 0;
              if (Board.SwimTimings !== 12.34) {
                SwimTimings = Board.SwimTimings;
              }

              EventResultArray.push({
                SwName: Board.SwimerName,
                SwimerClub: SwClubAndGrp.SwClub,
                Group: SwClubAndGrp.SwGroup,
                SwimStatus: Board.SwimStatus,
                SwimTimings: SwimTimings // or Board.SwimTimings if you prefer the raw value
              });
            });
          });

          // Determine display number: If EventList is still an array of IDs, use its index
          const displayNumber = Array.isArray(MeetData.EventList)
            ? (MeetData.EventList.indexOf(eventDetail.eventID) + 1)
            : EventCounter; // fallback to running counter if EventList not an array

          calculatePoints(EventResultArray, eventDetail.eventID)

        });

        PrepICTable();

      function GenerateHeatDetailsTable(ReportType = 1, Heats = []) {

          AvblReports = [];
          UpdateReportTitle(ReportType);

          Meetdteails = ExtractMeetInfo(MeetUpdatedData, "");

          for (let i = 0; i < entries.length; i++) {
            const [, heat] = entries[i]; // keep original signature: AddHeatRow(i, heat)

          }

          log.info("GenerateHeatDetailsTable completed.", { count: entries.length });

      /* ===========================
         AddHeatRow
         - UPDATED: EventList can be Dict
         =========================== */
      function AddHeatRow(index, Heat, ReportType) {
        try {

          const tblHeatDetails = getEl('tblHeatDetails', { required: true, desc: 'Heat details table' });
          if (!tblHeatDetails) return;

          const body = ensureTBody(tblHeatDetails);
          if (!body) {
            log.error("Cannot ensure TBODY for tblHeatDetails.");
            return;
          }
          const tblHeatDetailsRow = body.insertRow();
          tblHeatDetailsRow.id = "tblHeatDetailsRow" + index;

          // -------- Robust EventID computation (Dict-aware) --------
          let EventID = -1;
          let heatId = "";
          try {
            heatId = Heat?.ID;

            // Normalize EventList to "entries": supports array OR dict
            const eventListRaw = Meetdteails?.EventDetails ?? {};
            const eventEntries = Array.isArray(eventListRaw)
              // Array -> [{ idx, key (string index), value }]
              ? eventListRaw.map((ev, i) => ({ idx: i, key: String(i), value: ev }))
              // Dict -> Object.entries -> [{ idx (iteration order), key, value }]
              : Object.entries(eventListRaw).map(([k, v], i) => ({ idx: i, key: k, value: v }));

            if (eventEntries.length === 0) {
              log.warn("EventList missing or empty; cannot compute EventID.", { Meetdteails });
            } else if (typeof heatId !== 'string' || !heatId.length) {
              log.warn("Heat.ID not a valid string; cannot compute EventID.", { Heat });
            } else {
              const part = splitBeforeLastUnderscore(heatId);
              if (!part.ok) {
                log.warn("Heat.ID has no valid underscore partition; using full ID fallback.", { heatId, lastIndex: part.lastIndex });
              } else {
                const keyPrefix = normalizeStr(part.prefix);

                // Match against primitive strings OR objects with ID/Id/id
                const match = eventEntries.find(({ value }) => {
                  if (value == null) return false;
                  if (typeof value === 'string') return normalizeStr(value) === keyPrefix;
                  const candidate = (value?.ID ?? value?.Id ?? value?.id);
                  return typeof candidate === 'string' && normalizeStr(candidate) === keyPrefix;
                });

                if (!match) {
                  log.info("No matching event found for Heat prefix.", { prefix: keyPrefix, heatId, totalEvents: eventEntries.length });
                } else {
                  EventID = match.idx; // keep ordinal semantics (0-based)
                  log.debug("Matched EventID for Heat.", { EventID, prefix: keyPrefix, heatId, eventKey: match.key });
                }
              }
            }
          } catch (err) {
            EventID = -1;
            log.error("Failed to compute EventID.", err);
          }
          // Controls cell & swimmers table
          const tblSwlist = document.createElement("TABLE");
          if (ReportType == 0) {

            tblSwlist.id = "tblSwlist_Entry" + index;
          }
          else if (ReportType == 1) {
            tblSwlist.id = "tblSwlist_Result" + index;

          }
          AvblReports.push({ value: tblSwlist.id, text: "Heat" + heatId });

          const header = tblSwlist.createTHead();
          let row = header.insertRow();
          let cell = row.insertCell();

          // Header text logic with EventID safety
          const isSameEvent = (lastEvent === EventID);
          const heatNumberText = (typeof Heat?.ID === 'string' && Heat.ID.includes('_'))
            ? Heat.ID.substring(Heat.ID.lastIndexOf('_') + 1)
            : "?";
          const eventOrdinal = (EventID >= 0) ? (EventID + 1) : "N/A";

          let headerText;
          let highlightNewEvent = false;

          if (isSameEvent && EventID >= 0) {
            headerText = `<h4> <b> Event: ${eventOrdinal} Heat : ${heatNumberText}</b><h4>`;
          } else {
            lastEvent = EventID;
            const formatted = (typeof formatSwimmingEvent === 'function')
              ? formatSwimmingEvent(Heat.ID)
              : normalizeStr(Heat.ID);
            headerText = `<h4> <b '>Event: ${eventOrdinal} ${formatted}</b> <h4>`;
            highlightNewEvent = true;
          }

          cell.innerHTML = headerText;
          if (highlightNewEvent) {
            // cell.style.backgroundColor = "rgb(100, 100, 100)";
          }

          cell.colSpan = 5;
          {


            row = header.insertRow();

            c = row.insertCell(); c.innerHTML = "<b>Line<b>";
            // c = row.insertCell(); c.classList.add('hide-on-print'); c.innerHTML = "<b>SwimerID.<b>";
            c = row.insertCell(); c.innerHTML = "<b>Name<b>";

            if (ReportType == 0) {
              c = row.insertCell(); c.innerHTML = "<b>Age<b>";
            }
            else {
              c = row.insertCell(); c.innerHTML = "<b>Status<b>";
            }


            c = row.insertCell(); c.innerHTML = "<b>School \\ Club.<b>";

            if (ReportType == 0) {
              c = row.insertCell(); c.innerHTML = "<b>Seed Time<b>";

            }
            else {
              c = row.insertCell(); c.innerHTML = "<b>SwimTimeings<b>";


            }

          }


          tblHeatDetailsRow.appendChild(tblSwlist);


          const boards = Array.isArray(Heat?.Boardinfo) ? Heat.Boardinfo : [];
          for (let j = 0; j < boards.length; j++) {
            try {
              AddSwList(Heat, index, j, ReportType);
            } catch (err) {
              log.error("AddSwList failed for row", { index, j, Heat }, err);
            }
          }

        }
        catch (outerErr) {
          log.error("AddHeatRow fatal error.", { index, Heat }, outerErr);
        }
      }


      function AddSwList(Heat, index, j, ReportType) {
        try {
          // Table element
          let tblSwlist;

          if (ReportType == 0) {

            tblSwlist = getEl("tblSwlist_Entry" + index, { required: true });;
          }
          else if (ReportType == 1) {
            tblSwlist = getEl("tblSwlist_Result" + index, { required: true });
          }
          // const tblSwlist = getEl("tblSwlist_Result" + index, { required: true });
          if (!tblSwlist) return;

          // Source data for this row
          const board = Heat?.Boardinfo?.[j] ?? {};
          const SwimerID = board.SwimerID ?? '';
          let BoardID = board.BoardID ?? 0;

          const Swimerstatus = board.SwimStatus ?? 0;       // index-like code
          const SwimerName = normalizeStr(board.SwimerName ?? '');
          let Club = '';

          let EventName = "";
          let seedTime = "NT";
          let Age = 0;

          const heatId = Heat.ID;
          const part = splitBeforeLastUnderscore(heatId);
          if (!part.ok) {
            log.warn("Heat.ID has no valid underscore partition; using full ID fallback.", { heatId, lastIndex: part.lastIndex });
          } else {
            EventName = normalizeStr(part.prefix);
          }
          const bestTiming = Meetdteails.SwimmerDetails[SwimerID].Events.find(item => item.EventName === EventName)?.BestTimeings;
          Age = calculateAge(Meetdteails.SwimmerDetails[SwimerID].DOB);

          if (bestTiming == "") {
            seedTime = "NT";
          }
          else {
            seedTime = bestTiming;
          }


          // Defensive Meet details lookup
          try {
            const clubObj = Meetdteails?.SwimmerDetails?.[SwimerName];
            Club = normalizeStr(clubObj?.Club ?? '');
          } catch (clubErr) {
            log.warn("Club lookup failed.", { SwimerName }, clubErr);
          }

          // Ensure tbody exists and insert row
          const body = ensureTBody(tblSwlist);
          if (!body) return;
          const tblSwlistRow = body.insertRow();

          tblSwlistRowcell = tblSwlistRow.insertCell();

          tblSwlistRowcell.innerHTML = BoardID;





          tblSwlistRowcell = tblSwlistRow.insertCell();
          tblSwlistRowcell.innerHTML = SwimerName;

          tblSwlistRowcell = tblSwlistRow.insertCell();
          if (ReportType == 0) {
            tblSwlistRowcell.innerHTML = Age;
          }
          else {
            tblSwlistRowcell.innerHTML = DQMsg[Swimerstatus];

          }

          // ---------------- Club (textarea) ----------------
          tblSwlistRowcell = tblSwlistRow.insertCell();

          tblSwlistRowcell.innerHTML = Club

          tblSwlistRowcell = tblSwlistRow.insertCell();
          // c = row.insertCell(); c.innerHTML = "<b>SwimTimeings<b>";
          if (ReportType == 0) {
            tblSwlistRowcell.innerHTML = seedTime;
          }
          else {

            let val = '';
            if (board.SwimTimings != '00:00.000') val = ConvertTime(board.SwimTimings); // treat zero time as empty
            tblSwlistRowcell.innerHTML = val ?? '';
          }


          log.debug("AddSwList row added.", { index, j, SwimerName, Club });
        } catch (err) {
          log.error("AddSwList failed.", { index, j, Heat }, err);
        }
      }

      function Resort(data) {

        const sortedData = data.sort((a, b) => {
          if (a.value === 0 && b.value === 0) return 0; // both zero
          if (a.value === 0) return 1; // a goes to bottom
          if (b.value == 0) return -1; // b goes to bottom
          return a.value - b.value; // normal ascending sort
        });
        return sortedData;

      }

      function calculatePoints(EventResultArray, eventNameID) {
        Rowdata = [];
        let x = EventResultArray.map(result => {
          if (result.SwimStatus === 0) {
            return result.SwimTimings !== 12.34 ? result.SwimTimings : 0;
          }
          return 0;
        });
        let RankSorted = SortAndGetRank(x);
        let BoardRanks = RankSorted.map((value, index) => ({ key: index + 1, value }));

        let sortedBoards = BoardRanks.sort((a, b) => {
          if (a.value === 0 && b.value !== 0) return 1;
          if (a.value !== 0 && b.value === 0) return -1;
          return a.value - b.value;
        });

        // let sortedBoards = SortangGetRankForEvents(EventResultArray);

        for (let eventIndex = 0; eventIndex < EventResultArray.length; eventIndex++) {
          let swimmer = EventResultArray[sortedBoards[eventIndex].key - 1];
          if (!(swimmer.SwName in swClubGroupDict)) {
            swClubGroupDict[swimmer.SwName] = { SwClub: "ClubUnknown", SwGroup: "Group_Unknown", TotalScore: 0 };
          }
          let previousScore = swClubGroupDict[swimmer.SwName].TotalScore;
          let currentScore = GetPoints(sortedBoards[eventIndex].value);
          swClubGroupDict[swimmer.SwName].TotalScore = previousScore + currentScore;
          swClubGroupDict[swimmer.SwName].EventDetails = swClubGroupDict[swimmer.SwName].EventDetails + formatSwimmingEvent(eventNameID) + " : " + "  " + DQMsg[swimmer.SwimStatus] + " " + ConvertTime(swimmer.SwimTimings) + ";"
          Rowdata.push({
            "SlNO": eventIndex + 1, "Rank": sortedBoards[eventIndex].value, "SwimmerName": swimmer.SwName, "SwimmerClubSchool": swimmer.SwimerClub, "SwimStatus":
              DQMsg[swimmer.SwimStatus], "SwimTimings": ConvertTime(swimmer.SwimTimings !== 12.34 ? swimmer.SwimTimings : 0), "Points": currentScore
          });
        }
        EventResultsDict[eventNameID] = Rowdata;
      }

      function GetPoints(Rank) {
        let score = 0;
        switch (Rank) {
          case 0:
            score = 0;
            break;

          default:
            if (Rank >= 10) {
              score = 0;
            }
            else {
              score = pointsArray[Rank - 1];
              break;
            }


        }
        return score
      }
