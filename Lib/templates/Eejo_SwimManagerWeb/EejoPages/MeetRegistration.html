  <script>
    // import { parse, stringify } from 'lossless-json'
    GroupsSlectedRows = [];
    EventsSlectedRows = [];
    SwDetailsSlectedRows = [];
    HeatDetailsSlectedRows = [];
    Availablegroups = [];
    AvailableEvents = [];
    SwimmerDetailsArray = [];
    NoofBoards = 5;
    var MeetUpdatedData;

    var distencearray = [25, 50, 100, 200, 400, 800, 1000];
    var strokearray = ["FS", "BK", "BR", "FLY", "IM", "Relay"];
    var genderArray = ["B", "G", "M"];
    cmdurlwithHost = "http://" + GetEejoHostID() + ":5002";
      //cmdurlwithHost = "http://192.168.0.103:5002";


    MeetDataFirebaseURL = "https://eejo-managerdb-default-rtdb.firebaseio.com/Meets.json";
    FirebaseURLToWrite = "https://eejo-managerdb-default-rtdb.firebaseio.com/Meets/"
    showhide("BusyIndicatorpop");

    const searchInput = document.getElementById('searchInput');
    const table = document.getElementById('tblSwDetails');
    const rows = table.getElementsByTagName('tr');



    searchInput.addEventListener('keyup', function() {
        const filter = searchInput.value.toLowerCase();

        for (let i = 0; i < rows.length; i++) {
            let rowVisible = false;            
                const cellinput = document.getElementById('SwimmersNamecell'+i);
                if ( cellinput)
                {
                  cellText = cellinput.value;
                
                if (cellText.toLowerCase().indexOf(filter) > -1) {
                    rowVisible = true;                 
               }
            const tblSwimmersRow = document.getElementById('tblSwimmersRow'+i); 
            if (tblSwimmersRow)
            {
            if (rowVisible) {
              tblSwimmersRow.style.display = ''; // Show the row
            } else {
              tblSwimmersRow.style.display = 'none'; // Hide the row
            }
          }
        }
      }
    });


  


    async function LoadHeatNames(HeatFileSource) {
      MeetNameArray = [];
      initMeetNames(HeatFileSource);
      // ClearTable('tblMeet');
      // ClearTable('tblGroups');
      // ClearTable('tblEvents');
      ClearTable('tblSwDetails');
      ClearTable('tblHeatDetails');
      switch (HeatFileSource) {

        case "GetRunningHeatData":
          cmdurl = cmdurlwithHost + "/SetLiveHeatCommands?CmdName=GetRunningHeatData";
          try {
            let response = await fetch(cmdurl);
            let data = await response.json();


            MeetDataFirebase = data.commandReturnData;

            var Meetdteails = ExtractMeetInfo(MeetDataFirebase, "");
            MeetUpdatedData = Meetdteails.CurrentMeet;

            AvailableEvents = Meetdteails.EventList;

            GenerateHeatDetailsTable(Meetdteails.HeatList)
            GenerateSwimmersTable(Meetdteails.SwimmerDetails);

          } catch (error) {
            console.error('Error fetching data:', error);
          }
          break;
        case "Online":
          MeetDataFirebase = FetchMeetNames();
          break;

        case "Offline":
          cmdurl = cmdurlwithHost + "/getAvailableHeatNames";
          try {
            let response = await fetch(cmdurl);
            let data = await response.json();
            // console.log(data);
            MeetNameArray = LoadHeatFileName(data);
            NoofBoards = MeetNameArray.Boards;
            // MeetNameArray = LoadHeatFileName(data);
            initMeetNames(HeatFileSource);

          } catch (error) {
            console.error('Error fetching data:', error);
          }

          break;

        default:
          break;
      }
    }

    async function initMeetNames(HeatFileSource) {
      new MultiSelect('#MeetSelect', {
        data: MeetNameArray,
        placeholder: 'Select Meet',
        search: true,
        selectAll: false,
        listAll: true,
        max: 1,
        onChange: function (value, text, element) {
        },
        onSelect: async function (value, text, element) {

          let originalString = "This is a sample string: remove this part.";
          let separator = ".";
          let index = text.indexOf(separator);
          if (index !== -1) {
            let newString =
              SelectedMeetFile = text.slice(0, index);
            // Or: let newString = originalString.substring(0, index);
            console.log(newString); // Output: "This is a sample string"
          } else {
            SelectedMeetFile = text;
          }


          ClearTable('tblSwDetails');
          ClearTable('tblHeatDetails');

          if (HeatFileSource == "Online") {
            var Meetdteails = GetMeetDetails(MeetDataFirebase, value);
            MeetUpdatedData = Meetdteails.CurrentMeet;

            AvailableEvents = Meetdteails.EventList;
            GenerateHeatDetailsTable(Meetdteails.HeatList)
            GenerateSwimmersTable(Meetdteails.SwimmerDetails);
          }
          else if (HeatFileSource == "Offline") {
            cmdurl = cmdurlwithHost + "/SetLiveHeatCommands?CmdName=ReadHeatFromLocalFile&HeatFileName=" + value;

            try {
              let response = await fetch(cmdurl);
              let data = await response.json();
              MeetDataFirebase = data.commandReturnData;
              var Meetdteails = ExtractMeetInfo(MeetDataFirebase, value);
              MeetUpdatedData = Meetdteails.CurrentMeet;
              AvailableEvents = Meetdteails.EventList;
              GenerateHeatDetailsTable(Meetdteails.HeatList)
              GenerateSwimmersTable(Meetdteails.SwimmerDetails);

            } catch (error) {
              console.error('Error fetching data:', error);
            }
          }
        },
        onUnselect: function (value, text, element) {
        }
      });
    }
    function ClearTable(TableName) {
      var tableHeaderRowCount = 1;
      if (TableName == 'tblMeet') {
        tableHeaderRowCount = 0;
      }

      var table = document.getElementById(TableName);
      var rowCount = table.rows.length;
      for (var i = tableHeaderRowCount; i < rowCount; i++) {
        table.deleteRow(tableHeaderRowCount);
      }

    }
    async function FetchMeetNames() {
      showhide("BusyIndicatorpop", "Loading Swimmer table");
      var dataAPI = fetch(MeetDataFirebaseURL)
        .then(response => {
          return response.json()
        })
        .then(data => {
          MeetNameArray = LoadMeetNames(data)
          initMeetNames("Online");
          MeetDataFirebase = data;
          NoofBoards = MeetDataFirebase.Boards;
          showhide("BusyIndicatorpop");
          return;
        }, error => {
          console.error('onRejected function called: ' + error.message);
        })
    }

    async function SaveEventToFB(FirebaseURL, DataTopost) {
      showhide("BusyIndicatorpop", "Writing To Cloud");
      await fetch(FirebaseURL, {
        method: "PUT",
        body: JSON.stringify(DataTopost),
        headers: {
          "Content-type": "application/json; charset=UTF-8"
        }
      });
      showhide("BusyIndicatorpop");
    }

    function CaptureEdits(FileOptions) {
      MeetUpdatedData.EventList = AvailableEvents;
      MeetUpdatedData = CaptureHeatDetailsTable(MeetUpdatedData);
      MeetUpdatedData = CaptureSwDetailsTable(MeetUpdatedData);

      switch (FileOptions) {
        case 'Update':
          cmdurl = cmdurlwithHost + "/SetLiveHeatCommands?CmdName=SaveHeatFileToLocalFile";
          CmdParams = "&HeatData=" + JSON.stringify(MeetUpdatedData) + "&FileNametoSave=" + SelectedMeetFile + ".EejoHeat";
          ExecuteRestLocalCommands(cmdurl, CmdParams);
          break;
        case 'Cloud':
          SaveEventToFB(FirebaseURLToWrite + SelectedMeetFile + ".json", MeetUpdatedData);
          break;

        case 'SaveAs':

          break;
        case 'Delete':

          break;
        case 'InitLocal':
          cmdurl = cmdurlwithHost + "/SetLiveHeatCommands?CmdName=InitTimerFromLocalFile";
          CmdParams = "&HeatFileName=" + SelectedMeetFile + ".EejoHeat" + "&OverWriteOption=1";
          ExecuteRestLocalCommands(cmdurl, CmdParams);
          break;

        case 'SetRunningHeatData':
          cmdurl = cmdurlwithHost + "/SetLiveHeatCommands?CmdName=SetRunningHeatData";
          CmdParams = "&HeatData=" + JSON.stringify(MeetUpdatedData);
          ExecuteRestLocalCommands(cmdurl, CmdParams);
          break;

        case 'InitFireBase':
          // Sample for InitTimerFromFirebase 
          // Dont Add .Json
          FBURLToSync = "https://eejo-managerdb-default-rtdb.firebaseio.com/Meets/-OMMqFJyr21yr3qhscY_";
          cmdurl = cmdurlwithHost + "/SetLiveHeatCommands?CmdName=InitTimerFromFirebase";
          CmdParams = "&URLToSync=" + FBURLToSync + "&OverWriteOption=1";
          ExecuteRestLocalCommands(cmdurl, CmdParams);
          break;

        case 'Load':
          //Command to LoadHeatFile
          // cmdurl = cmdurlwithHost +"/SetLiveHeatCommands?CmdName=LoadHeatFromLocalFile";
          // CmdParams = "&HeatFileName=" +SelectedMeetFile;
          // ExecuteRestLocalCommands(cmdurl, CmdParams);     
          // cmdurl = cmdurlwithHost +"/SetLiveHeatCommands?CmdName=   &HeatFileName=TestMeet1.EejoHeat";
          // CmdToSend = "CmdName=" + "SaveHeatFileToLocalFile" + "&HeatData=" + JSON.stringify(MeetUpdatedData) + "&FileNametoSave=" + SelectedMeetFile;
          break;

        default:
          break;
      }
    }

    async function ExecuteRestLocalCommands(cmdurl, CmdtoSend) {
      try {
        showhide("BusyIndicatorpop", "ExecuteRestLocalCommands");
        urlToSend = cmdurl + CmdtoSend;
        await fetch(urlToSend)
          .then(response => {
            // Check if the response is successful
            if (!response.ok) {
              throw new Error('Network response was not ok: ' + response.statusText);
            }
            return response.json();
          })
          .then(data => {
            // MeetNameArray = LoadHeatFileName(data);
            // initMeetNames();
            showhide("BusyIndicatorpop");


            return data;
          })

          .catch(error => {
            console.error('There was a problem with the fetch operation:', error);
          });
      }
      catch (error) {
        console.error('There was a problem with the fetch operation:', error);
      }
    }

  </script>
