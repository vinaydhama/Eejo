<script>

    class AnimationPlayer {
        constructor() {
          this.animationQueue = [];
          this.isPlaying = false;
        }
    
        // Add animation to the queue
        addAnimation(name, durationInSeconds) {
          this.animationQueue.push({ name, duration: durationInSeconds * 1000 });
          this.playNext(); // Try to play if not already playing
        }
    
        // Play animations one by one
        async playNext() {
          if (this.isPlaying || this.animationQueue.length === 0) return;
    
          this.isPlaying = true;
    
          while (this.animationQueue.length > 0) {
            const { name, duration } = this.animationQueue.shift();
            switch (name) {
              case "An1":
                document.getElementById(name).style.display = "block";
                break;
              case "An2":
                document.getElementById(name).style.display = "block";
                break;
              case "An3":
                document.getElementById(name).style.display = "block";
                break;
    
              default:
                break;
            }
            console.log(`Playing ${name} for ${duration / 1000} seconds`);
            await this.sleep(duration);
            document.getElementById(name).style.display = "none";
          }
    
          this.isPlaying = false;
    
    
        }
    
        // Utility to wait
        sleep(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }
    
        // Clear the animation queue
        clearAnimations() {
          this.animationQueue = [];
          console.log("Animation backlog cleared.");
        }
      }
    
    </script>
<script>
    cmdurlwithHost = "http://" + GetEejoHostID() + ":5002";
    cmdurlwithHost = "http://" + "10.24.224.241" + ":5002";
    let WaitBeforeLoad = false;
    let loadedToStart = false;
    let InProgress = false;
    let BoardDetailsTime = {};
    let enrichedBoards;

    let data = [
        { name: "Vinay", line: "L1", rank: "00.00.000" },
        { name: "Vinayqwqwqwqwqwqwqwqwqwqq", line: "L2", rank: "00.00.000" },
        { name: "d", line: "L3", rank: "00.00.000" },
        { name: "dd", line: "L4", rank: "00.00.000" }
    ];

    async function LoadData() {
        try {
            const dataarr = await FetchValuesFromTimer("GetSwNames");
            data = dataarr.SwNames;
            let GetBoardStatusAndTimeRes = await FetchValuesFromTimer('GetBoardStatusAndTime');
            BoardDetailsTime = GetBoardStatusAndTimeRes.BoardStatusAndTime;
            enrichedBoards = BoardDetailsTime.map((board, index) => ({
                ...board,
                name: data[index] || `Board-${board.BoardID}`
            }));


        } catch (error) {
            console.error("Error fetching data:", error);
        }
    }

    // Call the function
    LoadData();

    async function GetBoardStatus() {
        let TimerStatus = await FetchValuesFromTimer('TimerStatus');
        console.log(TimerStatus.Message);
        switch (TimerStatus.Message) {
            case 'TimerStatus.loadedToStart':

                if (!loadedToStart) {
                    HideTabs([1, 2]);
                    HideAd();
                    const dataarr = await FetchValuesFromTimer("GetSwNames");
                    data = dataarr.SwNames;

                    await PlayIntro(data);
                    loadedToStart = true;
                    WaitBeforeLoad = false;

                }
                break;

            case 'NewHeat':
                break;
            case 'TimerStatus.InProgress':
                if (!InProgress) {
                    HideTabs([1, 2]);
                    await ShowAdd(["AddDiv" + 1, "AddDiv" + 2]);
                    InProgress = true;
                }

                break;
            //UpdateLocalTimer();
            case 'TimerStatus.WaitBeforeLoad': case 'Updating Result To Cloud':
                let GetBoardStatusAndTimeRes = await FetchValuesFromTimer('GetBoardStatusAndTime');
                BoardDetailsTime = GetBoardStatusAndTimeRes.BoardStatusAndTime;
                enrichedBoards = BoardDetailsTime.map((board, index) => ({
                    ...board,
                    name: data[index] || `Board-${board.BoardID}`
                }));
                if (!WaitBeforeLoad) {
                    HideTabs([1, 2]);
                    HideAd();
                    await ShowTimeDisplay(enrichedBoards)
                    loadedToStart = false;
                    InProgress = false;
                }
                break;
            default:
                break;
        }

    }
    setInterval(async () => { GetBoardStatus() }, 2000);
</script>
<script>
    document.addEventListener("keydown", function (event) {
        if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === "h") {
            openControlPanel();
        }
    });


    async function ShowTimeDisplay(data) {
        let table = document.getElementById("dynamicTable1");
        table.innerHTML = "";
        table.style.display = 'block';


        await data.forEach((item, index) => {
            const row = document.createElement("tr");
            row.className = "Resulttr";
            row.style.animationDelay = `${0.2 + index * 0.2}s`;

            const nameCell = document.createElement("td");
            nameCell.className = "Resulttd";
            nameCell.textContent = item.BoardID;

            const roleCell = document.createElement("td");
            roleCell.className = "Resulttd";

            roleCell.textContent = item.name;

            const rankCell = document.createElement("td");
            rankCell.className = "Resulttd";
            rankCell.textContent = item.Time;
            row.appendChild(nameCell);
            row.appendChild(roleCell);
            row.appendChild(rankCell);

            table.appendChild(row);
        });
    }


    function HideTabs(AddDivName = ['dynamicTable1', 'dynamicTable2']) {
        for (let index = 0; index < AddDivName.length; index++) {
            container = document.getElementById("dynamicTable" + AddDivName[index]);
            if (container) {
                container.style.display = 'none';
            }
        }
    }

    function HideAd(AddDivName = [1, 2]) {
        for (let index = 1; index <= AddDivName.length; index++) {
            container = document.getElementById("AddDiv" + index);
            if (container) {
                container.style.display = 'none';
            }
        }

    }
    async function ShowAdd(AddDivName, duration = 1) {
        await AddDivName.forEach(element => {
            container = document.getElementById(element);
            if (container) {
                container.style.display = 'block';
            }
            setTimeout(() => {
                for (let index = 1; index <= 2; index++) {

                    container = document.getElementById("AddDiv" + index);
                    if (container) {
                        container.style.display = 'none';
                    }

                }
                return;
            }, 10000);
        });
    }

    function openControlPanel() {
        window.open('ScreenCAP_Control.html', 'IframeControlPanel', 'width=400,height=600');
    }

    const channel = new BroadcastChannel('Eejo-Video-control');

    async function PlayIntro(data) {
        const table = document.getElementById("dynamicTable2");
        table.innerHTML = "";
        table.style.display = 'block';


        for (let index = 0; index < data.length; index++) {
            const element = data[index];
            const row = document.createElement("tr");
            row.className = "board" + (index + 1);
            // row.style.animationDelay = `${0.2 + index * 0.2}s`;

            const nameCell = document.createElement("td");
            nameCell.style.width = "300px"
            nameCell.textContent = data[index];

            const PhotoCell = document.createElement("td");
            PhotoCell.style.width = "300px"
            PhotoCell.textContent = "Photo";
            // row.appendChild(PhotoCell);
            row.appendChild(nameCell);
            table.appendChild(row);
        }

 
    }

    channel.onmessage = (event) => {
        const { action, iframeNum, value } = event.data;

        if (action === 'resize') {
            ReizeIframe(iframeNum, value.height, value.width);
        } else if (action === 'move') {
            MoveIframe(iframeNum, value.x, value.y);
        } else if (action === 'toggle') {
            toggleIframe(iframeNum);
        }
        else if (action === 'CAMSource') {
            CAMSource(iframeNum, value);
        }

        else if (action === 'ScaleIFrame') {
            ScaleIFrame(iframeNum, value.ScaleX, value.ScaleY);
        }

        else if (action === 'PlayAnimation') {
            ShowAdd(["AddDiv" + iframeNum, "AddDiv" + 2]);
        }

        else if (action === 'PlayIntro') {
            PlayIntro(value);
        }
        else if (action === 'HideAd') {
            if (value) {
                HideAd(value);
            }
            else {
                HideAd();
            }

        }
        else if (action === 'HideTabs') {
            HideTabs(value);
        }
        else if (action === 'ShowTimeings') {
            ShowTimeDisplay(value);
        }
    };

    function toggleIframe(num) {
        const container = document.getElementById('container' + num);
        if (container.style.display === 'none') {
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
        }
    }

    function ScaleIFrame(num, ScaleX, ScaleY) {
        const iframeId = "container" + num;
        const iframe = document.getElementById(iframeId);
        if (iframe) {
            iframe.style.transform = `scale(${ScaleX}, ${ScaleY})`;
            iframe.style.transformOrigin = "top left"; // Optional: adjust anchor point
        } else {
            console.warn(`Iframe with ID '${iframeId}' not found.`);
        }
    }

    function ReizeIframe(num, H, W,) {
        const iframe = document.getElementById('container' + num);
        iframe.style.width = W + 'px';
        iframe.style.height = H + 'px';
    }

    function CAMSource(num, sourceindex) {
        const iframe = document.getElementById('container' + num);
        iframe.src = URLSource[sourceindex];
    }

    function MoveIframe(num, x, y) {
        const container = document.getElementById('container' + num);
        container.style.left = x + 'px';
        container.style.top = y + 'px';
    }

</script>
