    function Resort(data) {

      //       const data = [
      //     { key: 10, value: 8 },
      //     { key: 12, value: 7 },
      //     { key: 2, value: 5 },
      //     { key: 8, value: 5 },
      //     { key: 11, value: 4 },
      //     { key: 4, value: 1 },
      //     { key: 6, value: 1 },
      //     { key: 7, value: 1 },
      //     { key: 1, value: 0 },
      //     { key: 3, value: 0 },
      //     { key: 5, value: 0 },
      //     { key: 9, value: 0 },
      //     { key: 13, value: 0 }
      // ];

      const sortedData = data.sort((a, b) => {
        if (a.value === 0 && b.value === 0) return 0; // both zero
        if (a.value === 0) return 1; // a goes to bottom
        if (b.value == 0) return -1; // b goes to bottom
        return a.value - b.value; // normal ascending sort
      });
      return sortedData;

    }


    function PltIndChampTable() {
      const container = document.getElementById("resultsContainer");

      const SwKeys = Object.keys(swClubGroupDict);
      const AvblGroup = {};

      let Dictclubscore = {}

        const element = swClubGroupDict[key];
        AvblGroup[element.SwGroup] = AvblGroup[element.SwGroup] ? AvblGroup[element.SwGroup] + ":" + key : key;
        AvblClub[element.SwClub] = AvblClub[element.SwClub] ? AvblClub[element.SwClub] + ":" + key : key;
      });

      // Individual Champion by Group
      Object.keys(AvblGroup).forEach(Grpkey => {
        if (Grpkey != undefined) {
          const Swimmeringroup = AvblGroup[Grpkey].split(":");
          const ScoreArray = Swimmeringroup.map(Swname => swClubGroupDict[Swname].TotalScore);
          const RankSorted = SortAndGetRankDescending(ScoreArray);

          const sortedBoards1 = RankSorted.map((value, index) => ({ key: index + 1, value }))
            .sort((a, b) => b.value - a.value);

          let sortedBoards = Resort(sortedBoards1);
          // Create new table
          const tbl = document.createElement("table");
          tbl.id = "table_IC" + Grpkey

          AvblReports.push({ value: tbl.id, text: "IC " + Grpkey });
          tbl.border = "1";
          tbl.style.marginBottom = "20px";
          tbl.style.width = "100%";
          container.appendChild(tbl);

          // Header

          HeaderRow.style.backgroundColor = "rgb(160, 160, 160)";

          let td = HeaderRow.insertCell();
          td.innerHTML = `<h3><b>IC ${formatSwimmingEvent("_" + Grpkey)}</b></h3>`;
          td.colSpan = 5;

          // Column headers

          ["Sl.NO", "Rank", "Swimmer Name", "Swimmer Club / School", "Total Points"].forEach(header => {
            newRow.insertCell().innerHTML = `<b>${header}</b>`;
          });

          // Data rows

    function GetPoints(Rank) {
      let score = 0;
      switch (Rank) {
        case 0:
          score = 0;
          break;
        case 1:
          score = 7;
          break;

        case 2:
          score = 5;
          break;

        case 3:
          score = 4;
          break;
        case 4:
          score = 3;
          break;
        case 5:
          score = 2;
          break;
        case 6:
          score = 1;
          break;
        case 7:
          score = 0;
          break;

        default:
          score = 0;
          break;
      }
      return score
    }
