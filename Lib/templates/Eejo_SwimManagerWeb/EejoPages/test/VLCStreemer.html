
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Camera Stream</title>
</head>
<body>
  <video id="video" controls autoplay muted style="width:100%;"></video>
  <script> "https://cdn.jsdelivr.net/npm/hls.js@latest"</script>
  <script>
    const video = document.getElementById('video');
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource('cam.m3u8');
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = 'cam.m3u8'; // Safari
    }
  </script>
</body>
</html>
