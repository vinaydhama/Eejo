<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <title>EEJO Manager - Host Control</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'></script>
    <script charset="utf-8" type="text/javascript" src="../../bootstrap/js/FireBaseDataRetrive.js"></script>
    <link href="../../bootstrap/css/Dark_Light.css" rel="stylesheet" type="text/css" />

<script charset="utf-8" type="text/javascript" src="../../bootstrap/js/Utility.js"></script>

    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
        .content-box { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 20px; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
    <nav class='navbar navbar-expand-lg navbar-dark bg-dark'>
        <div class='container-fluid'>
            <a class='navbar-brand' href='#'>EEJO Manager</a>
    <button onclick="{document.body.classList.toggle('dark')}">B</button>

            <button class='navbar-toggler' type='button' data-bs-toggle='collapse' data-bs-target='#navbarNav'>
                <span class='navbar-toggler-icon'></span>
            </button>
            <div class='collapse navbar-collapse' id='navbarNav'>
                <ul class='navbar-nav ms-auto'>
                    <li class='nav-item'><a class='nav-link active' href='#'>Dashboard</a></li>
                    <li class='nav-item'><a class='nav-link' href='#'>Settings</a></li>
                    <li class='nav-item'><a class='nav-link' href='#'>Help</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class='container my-4'>
        <div class='content-box'>
            <h2 class='mb-3'>Host Control Dashboard</h2>
            <div class='table-responsive'>
                <table id='Tab1' class='table table-bordered text-center align-middle'></table>

        </div>

    <script src='responsive_table.js'></script>
