    {

function showhide(state, id, BusyMsg = "") {

    if (BusyMsg!="")
{
var BusyMsgobj = document.getElementById("BusyMsg");
BusyMsgobj.innerHTML = BusyMsg
}

var e = document.getElementById(id);
if (state==true)
{
    e.style.display ='block'
}
else
{
    e.style.display ='none'
}
// e.style.display = (e.style.display == 'block') ? 'none' : 'block';

async function fetchTimerState() {
            try {
                
                urlToFetch = GetTimerStateurl;
                await fetch(urlToFetch)
                    .then(response => {
                        // Check if the response is successful
                        if (!response.ok) {
                            throw new Error('Network response was not ok: ' + response.statusText);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // Display the data
                        // var obj = JSON.parse(data);
                        var Timerstate= document.getElementById('TimerState');
                        document.getElementById("TimerState").innerHTML = data.Message;                        
                        if (data.TimerState=="Busy"){
                            showhide(true, "BusyIndicatorpop",data.Message);
                        }
                        else{
                            showhide( false,"BusyIndicatorpop","");
                        }
                        return;
                    })

                    .catch(error => {
                        console.error('There was a problem with the fetch operation:', error);
                    });
            }
            catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }

        async function fetchAndDisplayIP() {
            try {
                cmdurl = baseURL+ "/SetLiveHeatCommands?CmdName=GetRestIP";
                urlToFetch = cmdurl;
                await fetch(urlToFetch)
                    .then(response => {
                        // Check if the response is successful
                        if (!response.ok) {
                            throw new Error('Network response was not ok: ' + response.statusText);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // Display the data
                        document.getElementById("marqueDisplay").innerHTML=data.commandReturnData;

                        return data;
                    })

                    .catch(error => {
                        console.error('There was a problem with the fetch operation:', error);
                    });
            }
            catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }



        //showhide("BusyIndicatorpop", "Loading Swimmer table");

            try {

            catch (error) {

            }

        function ConvertTime(sec)
        {
            ConvertedTime="";
            mins = sec / 60
            sec = sec % 60
            ConvertedTime=  parseInt(mins)+":" + sec.toFixed(3);
            return ConvertedTime
        }


        async function fetchAndDisplayMeetData() {
            try {
                urlToFetch = MeetDetailsurl;

                await fetch(urlToFetch)
                    .then(response => {
                        // Check if the response is successful
                        if (!response.ok) {
                            throw new Error('Network response was not ok: ' + response.statusText);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // Display the data
                        DispplayMeetData(data);
                        return data;
                    })

                    .catch(error => {
                        console.error('There was a problem with the fetch operation:', error);
                    });
            }
            catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }

        function DispplayMeetData(jsonData) {
            try {
                console.info("Data Received" + jsonData);
                const obj = JSON.parse(jsonData["MeetDetail"]);
                // For Single Prop obj.MeetName
                document.getElementById("MeetName").innerHTML = obj.MeetName;
                document.getElementById("MeetDate").innerHTML = obj.MeetDate;

            }
            catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }

        function DisplayHeatData(jsonData) {

            catch (error) {

        function displayTimeData(data) {
            // const CurrentTimeDisplay = document.getElementById("CurrentTimeDisplay")
            //     CurrentTimeDisplay.innerHTML = new Date().toLocaleString();
            try {
                let jdata =[]
                if (!TableCreated)
                {
                    tableCreate(data.Boards.length);
                    TableCreated= true
                }

                for (var i = 1; i <= data.Boards.length; i++) {                   
                    const obj = JSON.parse(data.Boards[i-1]);
                    jdata[i]= obj;
                }
                // Sorting Results
                for (let i = 0; i < jdata.length - 1; i++) {
                    for (let j = 1; j < jdata.length - i - 1; j++) {
                        if (jdata[j].timerValue > jdata[j + 1].timerValue) {
                            let temp = jdata[j];
                            jdata[j] = jdata[j + 1];
                            jdata[j + 1] = temp;
                        }
                    }
                }
                console.log(jdata);
                for (var i = 1; i <= jdata.length - 1; i++) {
                    const BoardIDDisp = document.getElementById("BordNum" + i);
                    const NameDisplay = document.getElementById("SwName" + i);
                    const TimeDisplay = document.getElementById("TimerDisp" + i);
                    // const RankDisplay = document.getElementById("Rank" + i);
                    // const obj = JSON.parse(data.Boards[i - 1]);

                    BoardIDDisp.innerHTML = jdata[i].boardId;
                    NameDisplay.innerHTML = jdata[i].swimmername;
                    TimeDisplay.innerHTML = ConvertTime(jdata[i].timerValue);

                    // RankDisplay.innerHTML = data.myRank + i;
                }

            }
            catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
