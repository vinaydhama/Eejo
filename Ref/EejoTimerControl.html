        function ExecuteLiveCmd(CmdToSend, CmdDict) {

            // if (btnid.textContent("_"))
            // {
            //     var cmdarray =btnid.Split("_");
            //     CmdToSend= cmdarray;
            // }

            switch (CmdToSend) {
                case 'SetNextHeat':
                    HeatName = CmdDict;
                    CmdToSend = "CmdName=" + "SetNextHeat" + "&HeatName=" + HeatName;
                    break;

                case 'AutoFindHeat':
                    AutoCmd = CmdDict;
                    CmdToSend = "CmdName=" + "AutoFindHeat" + "&AutoCmd=" + AutoCmd;
                    break;

                case 'Start': // 1-Start, 2-Pause,3-Stop,4-Repeat
                    CmdToSend = "CmdName=" + "HeatCommand" + "&HeatCmdValue=" + "1";
                    break;

                case 'Pause': // 1-Start, 2-Pause,3-Stop,4-Repeat
                    CmdToSend = "CmdName=" + "HeatCommand" + "&HeatCmdValue=" + "2";
                    break;
                case 'Stop': // 1-Start, 2-Pause,3-Stop,4-Repeat
                    CmdToSend = "CmdName=" + "HeatCommand" + "&HeatCmdValue=" + "3";
                    break;
                case 'Complete': // 1-Start, 2-Pause,3-Stop,4-Complete
                    CmdToSend = "CmdName=" + "HeatCommand" + "&HeatCmdValue=" + "4";
                    break;

                case 'SwimmerNameDispCmd': // SwBoardID=""&SwNameValue=""
                    SwBoardID = CmdDict["SwBoardID"];
                    SwNameValue = CmdDict["SwNameValue"];
                    CmdToSend = "CmdName=" + "SwimmerNameDispCmd" + "&SwBoardID=" + SwBoardID + "&SwNameValue=" + SwNameValue;
                    break;
                //TBD

                case 'SwimmerTimeDispCmd': // SwBoardID=""&SwTimeValue=""
                    SwBoardID = CmdDict["SwBoardID"];
                    SwTimeValue = CmdDict["SwTimeValue"];
                    // SwBoardID = request.args.get('SwBoardID')
                    // SwTimeValue = request.args.get('SwTimeValue')
                    CmdToSend = "CmdName=" + "SwimmerTimeDispCmd" + "&SwBoardID=" + SwBoardID + "&SwTimeValue=" + SwTimeValue;
                    break;
                //TBD

                case 'SwimmerStatusCmd':  // SwBoardID=""&SwStatusCmdValue="" 0-NA, 1-AB,2-DQ,3-DNC
                    SwBoardID = CmdDict["SwBoardID"];
                    SwStatusCmdValue = CmdDict["SwStatusCmdValue"];
                    CmdToSend = "CmdName=" + "SwimmerStatusCmd" + "&SwBoardID=" + SwBoardID + "&SwStatusCmdValue=" + SwStatusCmdValue;
                    break;
                //TBD

                case 'BoardTimerCmd': // SwBoardID=""&BoardTimerCmdValue="" //  1-Pause,2-Continue,3-Disable,4-Bypass
                    SwBoardID = CmdDict["SwBoardID"];
                    BoardTimerCmdValue = CmdDict["BoardTimerCmdValue"];
                    CmdToSend = "CmdName=" + "BoardTimerCmd" + "&SwBoardID=" + SwBoardID + "&BoardTimerCmdValue=" + BoardTimerCmdValue;
                    break;

            }
            if (CmdToSend != "") {
                SendLiveCmd(CmdToSend);
            }

        }

        async function SendLiveCmd(CmdtoSend) {
            try {
                urlToFetch = cmdurl + CmdtoSend;
                await fetch(urlToFetch)
                    .then(response => {
                        // Check if the response is successful
                        if (!response.ok) {
                            throw new Error('Network response was not ok: ' + response.statusText);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // Display the data
                        // displayTimeData(data);
                        return data;
                    })

                    .catch(error => {
                        console.error('There was a problem with the fetch operation:', error);
                    });
            }
            catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }
