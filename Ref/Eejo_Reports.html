  Firebaseurl = "https://eejo-managerdb-default-rtdb.firebaseio.com/Swimmers.json";
  // Function to fetch and display JSON data
  fetchAndEventResults(Firebaseurl);
  async function fetchAndEventResults(Firebaseurl) {
    var dataAPI = fetch(Firebaseurl) // append .json at the end of the url to make a RESTful request
      .then(response => {
        return response.json()
      })
      .then(data => {
        // Work with JSON data here
        jsonData = data;
        displayEventResults(jsonData);
        return data;
      }, error => {
        console.error('onRejected function called: ' + error.message);
      })
  }
  function PlotStroke(data,SwName,StrokecomboBox) {
    var timearray=[]
    var xValues=[]
    for (let i = 0; i < (data.length); i++) {
      if (SwName == data[i]["Name"]) {
        for (let j = 0; j < (data[i]["MeetResults"].length); j++) {
          if (data[i]["MeetResults"][j]["EventID"]!== "") {
         var stroketypa = data[i]["MeetResults"][j]["EventID"].split("_");
         var stroketyp= stroketypa[0]+"_"+ stroketypa[1]          
            if (stroketyp == StrokecomboBox) {
              // var newOption = document.createElement("option"); // Create a new option
              // newOption.value = stroketyp; // Set the value
              // newOption.text = stroketyp; // Set the text
              // StrokecomboBox.add(newOption); // Add the new option to the ComboBox
              
              timearray.push(data[i]["MeetResults"][j]["timeings"]);
              let heattime= (data[i]["MeetResults"][j]["HeatDateTime"]).toString()
              xValues.push(heattime.substring(8, 6)+"-" + heattime.substring(6, 4)+"-" + heattime.substring(0, 4)+"  "
              +heattime.substring(10, 8)+":" + heattime.substring(12, 10)+":"+ heattime.substring(14, 12

              ));
            }
          }
        }

      }
    }


    new Chart("myChart", {
    type: "line",
    data: {
      labels: xValues,
      datasets: [{
        data: timearray,
        borderColor: "red",
        fill: false
      }]
    },
    options: {
      legend: { display: true }
    }
  });

  function LoadStrokes(data, SwName) {
    var StrokecomboBox = document.getElementById("SelectStroke"); // Get the ComboBox
    StrokecomboBox.addEventListener("change", function () {
      PlotStroke(data, SwName,StrokecomboBox.value);
    });
    var items = []; // Array to hold the items
    for (let i = 0; i < (data.length); i++) {
      if (SwName == data[i]["Name"]) {
        for (let j = 0; j < (data[i]["MeetResults"].length); j++) {
          if (data[i]["MeetResults"][j]["EventID"]!== "") {
         var stroketypa = data[i]["MeetResults"][j]["EventID"].split("_");
         var stroketyp= stroketypa[0]+"_"+ stroketypa[1]
          
            const foundElement = items.find(element => element === stroketyp);
            if (foundElement == undefined) {
              var newOption = document.createElement("option"); // Create a new option
              newOption.value = stroketyp; // Set the value
              newOption.text = stroketyp; // Set the text
              StrokecomboBox.add(newOption); // Add the new option to the ComboBox
              items.push(stroketyp);
            }
          }
        }

      }
    }

  }

  function LoadSwNames(data) {
    var namecomboBox = document.getElementById("SelectSwName"); // Get the ComboBox
    //LoadStrokes(data,"SW_G6-B1")

    namecomboBox.addEventListener("change", function () {
      LoadStrokes(data, namecomboBox.value);
    });

    for (let i = 0; i < (data.length); i++) {

      var newOption = document.createElement("option"); // Create a new option
      newOption.value = data[i]["Name"]; // Set the value
      newOption.text = data[i]["Name"]; // Set the text
      namecomboBox.add(newOption); // Add the new option to the ComboBox

    }
  }
  function displayEventResults(jsonData) {

    try {
      let jdata = []

      td1.appendChild(document.createTextNode("RANK."));
      td1 = tr.insertCell();
      LoadSwNames(jsonData)

      for (let i = 0; i < (jsonData["HeatList"].length); i++) {
        for (let j = 0; j < (jsonData["HeatList"][i]["BoardList"].length); j++) {
          tr = tbl.insertRow();

        }
      }
      body.appendChild(tbl);
    }
    catch (error) {
      console.error('There was a problem with the fetch operation:', error);
    }
  }
